name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System libraries for gmsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgl1 libxrender1 libxcursor1 libxft2 libxinerama1
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - name: Fast tests (synthetic layouts; the example tests skip without the sibling repositories)
        run: pytest
      - name: Slow tests (gmsh meshing and the stdio MCP protocol)
        run: pytest -m slow
