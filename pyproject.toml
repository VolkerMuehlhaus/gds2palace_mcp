[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gds2palace_mcp"
dynamic = ["version"]
description = "MCP server for gds2palace: inspect GDSII layouts and stackups, check and generate AWS Palace models"
authors = [
    { name = "Volker Muehlhaus", email = "volker@muehlhaus.com" }
]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "gds2palace>=0.9.2",
    "gds_viewer>=0.2.0",
    "gds_prepare_for_EM>=1.7.0",
    "plot_snp>=0.1.0",
    "scikit-rf",
    "matplotlib",
    "gdspy>1.6.0",
    "shapely>=2.0",
    "numpy",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/VolkerMuehlhaus/gds2palace_mcp"
Documentation = "https://github.com/VolkerMuehlhaus/gds2palace_mcp/blob/main/docs/README.md"

[project.scripts]
gds2palace_mcp = "gds2palace_mcp.server:main"

[tool.setuptools.dynamic]
version = {attr = "gds2palace_mcp.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = [
    "slow: meshing with gmsh and the stdio MCP protocol test (run with: pytest -m slow)",
    "examples: needs the sibling gds2palace / gds_prepare_for_EM / lumpedmodel repositories (skipped without them)",
]
